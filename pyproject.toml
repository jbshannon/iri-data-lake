[project]
name = "iri-lake-analytics"
version = "0.1.0"
description = "SQL analytics layer over the iri-lake Bronze Parquet lake (DuckDB)"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
]

# The Rust crate (src/, benches/) does not depend on this project and
# this project does not depend on the Rust build: DuckDB reads the
# Parquet files the binary writes, and nothing links the two. The shared
# contract is the on-disk format (zstd Parquet, Hive year=/category=/
# channel= partitioning) documented in ARCHITECTURE.md, not a dependency.
#
# `uv.lock` pins the exact wheel; `uv run` syncs .venv on demand.
